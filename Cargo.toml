[package]
name = "soundx"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A Rust-first, SoX-inspired audio processor"
license = "LGPL-2.1-or-later OR MIT"

[[bin]]
name = "soundx"
path = "src/main.rs"

[lib]
name = "soundx"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.4"
glob = "0.3"
hound = "3.5"
ogg = "0.9.2"
oxideav-adpcm = "0.0.7"
oxideav-gsm = "0.0.10"
codec_core = { package = "rvoip-codec-core", version = "0.3.10", default-features = false, features = ["amr"] }
rayon = "1.10"
rusty_aac = "0.5.0"
rusty_flac = "0.1.3"
rusty_mp3 = "0.8.0"
rusty_vorbis = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["all"] }
wavicle = { version = "0.1.0", path = "vendor/wavicle", features = ["encode"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
