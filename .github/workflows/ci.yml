name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy,rustfmt

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Verify native package architecture
        run: |
          ACTUAL_TARGET="$(rustc -vV | sed -n 's/host: //p')"
          test "$ACTUAL_TARGET" = "${{ matrix.target }}"

      - name: Build release
        run: cargo build --release --locked

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $compiler.FullName "/DAppVersion=$version" installer/soundx.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Create package directory
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="soundx-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARCHIVE_NAME}/examples"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/release/soundx.exe" "dist/${ARCHIVE_NAME}/"
          else
            cp "target/release/soundx" "dist/${ARCHIVE_NAME}/"
          fi

          cp README.md "dist/${ARCHIVE_NAME}/"
          cp THIRD_PARTY_NOTICES.md "dist/${ARCHIVE_NAME}/"
          cp -R docs pages skills "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-MIT ] && cp LICENSE-MIT "dist/${ARCHIVE_NAME}/"
          [ -f LICENSE-LGPL ] && cp LICENSE-LGPL "dist/${ARCHIVE_NAME}/"
          cp examples/* "dist/${ARCHIVE_NAME}/examples/"

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="soundx-${VERSION}-${{ matrix.target }}"
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C dist "${ARCHIVE_NAME}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archiveName = "soundx-${version}-${{ matrix.target }}"
          $distDir = "dist"
          Compress-Archive -Path "$distDir/$archiveName/*" -DestinationPath "$distDir/${archiveName}.zip" -Force

      - name: Generate SHA256 checksums
        run: |
          cd dist
          shopt -s nullglob
          ASSETS=(soundx-*.tar.gz soundx-*.zip soundx-*-setup.exe)
          test "${#ASSETS[@]}" -gt 0
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSETS[@]}" > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 "${ASSETS[@]}" > "SHA256SUMS-${{ matrix.target }}.txt"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/

      - name: Merge and verify package checksums
        run: |
          cat dist/SHA256SUMS-*.txt | sort -k2 > dist/SHA256SUMS.txt
          cd dist
          sha256sum --check SHA256SUMS.txt

      - name: List packages
        run: ls -lh dist/

      - name: Generate release notes
        run: |
          {
            echo "## soundx ${{ github.ref_name }}"
            echo ""
            echo "### Downloads"
            echo ""
          } > /tmp/release-notes.md
          for f in dist/*.tar.gz dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt; do
            [ -f "$f" ] && echo "- \`${f##*/}\`" >> /tmp/release-notes.md
          done
          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### Changes since previous tag" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          PREV=$(git tag --sort=-version:refname | head -2 | tail -1 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log --pretty=format:"- %s (%h)" "${PREV}..HEAD" >> /tmp/release-notes.md 2>/dev/null || true
          else
            git log --pretty=format:"- %s (%h)" >> /tmp/release-notes.md 2>/dev/null || true
          fi
          cat /tmp/release-notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ASSETS=()
          for f in *.tar.gz *.zip *-setup.exe SHA256SUMS.txt; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          gh release create "${{ github.ref_name }}" \
            "${ASSETS[@]}" \
            --title "soundx ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
